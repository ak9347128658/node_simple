name: Build and Deploy to EC2

# Trigger: run on every push to main. Adjust the branch as needed.
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual runs from the Actions tab

# Concurrency: cancel an in-progress deploy if a newer commit is pushed.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}   # e.g. ghcr.io/user/repo

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required to push to GHCR
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tag the image with the short commit SHA for traceability + 'latest'.
      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no setup needed

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="ghcr.io/${{ github.repository }}"
            TAG="${{ needs.build-and-push.outputs.image_tag }}"

            # 1. Authenticate to GHCR so we can pull the private image.
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull the freshly built image by its immutable SHA tag.
            docker pull "$IMAGE:$TAG"

            # 3. Stop and remove the old container (ignore errors if none).
            docker stop node-app || true
            docker rm node-app || true

            # 4. Run the new container.
            #    - restart=always: survives reboots and crashes
            #    - map host :80 to container :3000 so users hit the app on port 80
            docker run -d \
              --name node-app \
              --restart always \
              -p 80:3000 \
              -e NODE_ENV=production \
              -e APP_VERSION="$TAG" \
              "$IMAGE:$TAG"

            # 5. Clean up dangling images to reclaim disk on the small instance.
            docker image prune -f