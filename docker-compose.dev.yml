version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # agar multi-stage mein development chahiye to adjust karo
    container_name: private-nodejs-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    command: npm run dev